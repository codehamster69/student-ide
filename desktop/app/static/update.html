<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Scribelab: update needed</title>
<style>
  /* same tokens as frontend/src/ui/tokens.css (no web fonts: this page must work offline) */
  :root { --bg:#f6f6f1; --surface:#fff; --surface-2:#f0f0ea; --text:#0b0b0f; --muted:#55565f; --faint:#8a8b94; --border:#e3e3dc; --accent:#0b0b0f; --accent-hover:#26262e; --accent-fg:#c6f432; --accent-soft:rgb(198 244 50 / .38); --cta:#3f6b00; --accent-2:#d61f73; --glow:0 0 0 1px rgb(63 107 0 / .25), 0 8px 22px -10px rgb(95 138 0 / .55); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0f; --surface:#131318; --surface-2:#1a1a21; --text:#f4f5ef; --muted:#a5a7b4; --faint:#6f7180; --border:#25252f; --accent:#c6f432; --accent-hover:#d6ff55; --accent-fg:#0b0b0f; --accent-soft:rgb(198 244 50 / .12); --cta:#c6f432; --accent-2:#ff7cbb; --glow:0 0 0 1px rgb(198 244 50 / .4), 0 8px 28px -10px rgb(198 244 50 / .55); } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:14px/1.55 "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  header { height:56px; display:flex; align-items:center; gap:10px; padding:0 24px; font-weight:600; font-size:15px; letter-spacing:-.01em; }
  .mark rect.bg { fill:var(--accent); } .mark .fg { fill:var(--accent-fg); }
  .wrap { flex:1; display:grid; place-items:center; padding:16px 16px 12vh; }
  main { width:100%; max-width:30rem; padding:28px; border:1px solid var(--border); border-radius:18px; }
  .icon { width:40px; height:40px; border-radius:10px; display:grid; place-items:center; border:1px solid var(--border); color:var(--cta); margin-bottom:16px; }
  h1 { font-size:18px; line-height:1.3; letter-spacing:-.01em; margin:0 0 6px; } p { margin:6px 0; color:var(--muted); } b { color:var(--text); font-weight:600; }
  code { font:12.5px/1.4 ui-monospace, "JetBrains Mono", Menlo, monospace; border:1px solid var(--border); padding:1px 6px; border-radius:6px; color:var(--text); }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:20px; }
  button, a.btn { font:inherit; font-weight:600; display:inline-flex; align-items:center; height:36px; padding:0 16px; border-radius:10px; border:1px solid transparent; background:none; color:var(--cta); cursor:pointer; text-decoration:none; transition:border-color .15s ease-out, transform .15s ease-out, box-shadow .15s ease-out; }
  button:hover, a.btn:hover, button:focus-visible, a.btn:focus-visible { border-color:var(--cta); transform:translateY(-1px); box-shadow:var(--glow); }
  @media (prefers-reduced-motion: reduce) { button, a.btn { transition:none; } button:hover, a.btn:hover { transform:none; } }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .status { display:inline-flex; align-items:center; gap:8px; color:var(--faint); font-size:13px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); animation:p 1.4s ease-in-out infinite; }
  @keyframes p { 50% { opacity:.25; } } @media (prefers-reduced-motion: reduce) { .dot { animation:none; } }
  #progress { color:var(--text); }
</style>
</head>
<body>
<header><svg class="mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0B0B0F"/><rect x="0.4" y="0.4" width="31.2" height="31.2" rx="8.6" fill="none" stroke="#C6F432" stroke-opacity=".45" stroke-width=".8"/><path fill="#C6F432" fill-rule="evenodd" transform="rotate(-18 15 17)" d="M9.5 6.5H20.5V11.5C20.5 15.5 18 19.5 15 27C12 19.5 9.5 15.5 9.5 11.5Z M13.3 11.3a1.7 1.7 0 1 0 3.4 0a1.7 1.7 0 1 0-3.4 0Z M14.4 13.4H15.6V22.5L15 23.8L14.4 22.5Z"/><path fill="#FF5CA8" d="M24.5 4.5Q25 8 28 8.5Q25 9 24.5 12.5Q24 9 21 8.5Q24 8 24.5 4.5Z"/></svg>Scribelab</header>
<div class="wrap">
<main>
  <div class="icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></div>
  <h1>Update Scribelab to continue</h1>
  <p>Scribelab <b id="min"></b> is out and every copy needs it; this one is <b id="v"></b>.</p>
  <p>Your work is saved on the server. After updating you carry on where you left off.</p>
  <p id="reason" hidden></p>
  <p id="progress" hidden></p>
  <div class="row"><a id="dl" class="btn" target="_blank" rel="noopener">Download the new version</a></div>
</main>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("v").textContent = q.get("version");
  document.getElementById("min").textContent = q.get("min");
  const dl = document.getElementById("dl");
  if (q.get("download")) dl.href = q.get("download"); else dl.remove();
  // manual copies (portable .exe, .deb, a Mac copy that can't replace itself): why, and what to do
  const reason = document.getElementById("reason");
  if (q.get("reason")) { reason.hidden = false; reason.textContent = q.get("reason"); }
  // the app updates itself where it can (modules/updates.ts) and reports here
  const progress = document.getElementById("progress");
  window.setProgress = (text) => { progress.hidden = false; progress.textContent = text; };
  if (q.get("auto")) { window.setProgress("Looking for the update…"); dl.textContent = "Or download it yourself"; }
</script>
</body>
</html>
