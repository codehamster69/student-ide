<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Student IDE: update needed</title>
<style>
  :root { --bg:#f7f7f8; --surface:#fff; --text:#18181b; --muted:#6b6b76; --border:#e4e4e7; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111113; --surface:#1a1a1e; --text:#ececef; --muted:#9c9ca8; --border:#2a2a30; --accent:#8b8cf8; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:15px/1.55 system-ui, sans-serif; }
  main { max-width:28rem; margin:16px; padding:2rem; background:var(--surface); border:1px solid var(--border); border-radius:16px; }
  h1 { font-size:1.2rem; margin:0 0 .4rem; } p { margin:.4rem 0; color:var(--muted); }
  a { display:inline-block; margin-top:1.25rem; padding:.55rem 1.1rem; border-radius:999px; background:var(--accent); color:#fff; text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1>Update Student IDE to continue</h1>
  <p>This app is version <b id="v"></b>; the college server needs <b id="min"></b> or newer.</p>
  <p>Your work is saved on the server. After updating you carry on where you left off.</p>
  <p id="progress" hidden></p>
  <a id="dl" target="_blank" rel="noopener">Download the new version</a>
</main>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("v").textContent = q.get("version");
  document.getElementById("min").textContent = q.get("min");
  const dl = document.getElementById("dl");
  if (q.get("download")) dl.href = q.get("download"); else dl.remove();
  // the app updates itself where it can (modules/updates.ts) and reports here
  const progress = document.getElementById("progress");
  window.setProgress = (text) => { progress.hidden = false; progress.textContent = text; };
  if (q.get("auto")) { window.setProgress("Looking for the update…"); dl.textContent = "Or download it yourself"; }
</script>
</body>
</html>
