# Desktop app: test the installer, then package Student IDE for Windows, macOS and Linux
# with the bundled container engine (WSL distro / Lima / static Podman).
# Pushing a tag desktop-vX.Y.Z also publishes a GitHub release of that version: the
# server serves it to installed apps as their auto-update feed (desktop_updates.py).
name: desktop
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop/installer } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: App typechecks against the installer and the sandbox runtime
        run: npm run build && npm --prefix ../sandbox ci && npm --prefix ../sandbox run build && npm --prefix ../app ci && npm --prefix ../app run typecheck
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }

  wsl-rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: desktop/installer/scripts/fetch-assets.sh win
      - uses: actions/upload-artifact@v4
        with:
          name: wsl-rootfs
          path: desktop/installer/assets/wsl/studentide-rootfs.tar.gz
          retention-days: 7

  # Real end-to-end setup on a Linux runner as an ordinary user: no-admin static Podman route.
  linux-setup-e2e:
    needs: test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop/installer } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Engine downloads and Electron zips come from GitHub releases, which can 504 for an
      # hour; a cache keyed on the pinned versions keeps packaging working through that.
      - uses: actions/cache@v4
        with:
          path: |
            desktop/installer/assets/lima/arm64
            desktop/installer/assets/lima/x64
            desktop/installer/assets/podman-static
          key: engine-assets-${{ runner.os }}-${{ hashFiles('desktop/installer/scripts/fetch-assets.sh') }}
      - run: npm ci && npm run build && scripts/fetch-assets.sh linux
      - name: Run setup as a user without sudo or Podman
        run: |
          sudo apt-get remove -y podman buildah >/dev/null 2>&1 || true
          sudo useradd -m student-ci
          sudo sed -i '/^student-ci:/d' /etc/subuid /etc/subgid
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo cp -r dist assets /home/student-ci/ && sudo chown -R student-ci /home/student-ci
          echo '{"images":[{"ref":"docker.io/library/alpine:3.22","subject":"CI"}]}' | sudo -u student-ci tee /home/student-ci/images.json
          NODE="$(command -v node)"; sudo chmod o+rx "$(dirname "$NODE")" || true
          cd /home/student-ci && sudo -u student-ci env HOME=/home/student-ci USER=student-ci PATH=/usr/bin:/bin \
            "$NODE" dist/cli.js --data-dir /home/student-ci/sid --assets /home/student-ci/assets --images /home/student-ci/images.json

  package:
    needs: [test, wsl-rootfs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: --win }
          - { os: macos-latest, target: --mac }
          - { os: ubuntu-latest, target: --linux }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop/installer, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Engine downloads and Electron zips come from GitHub releases, which can 504 for an
      # hour; a cache keyed on the pinned versions keeps packaging working through that.
      - uses: actions/cache@v4
        with:
          path: |
            desktop/installer/assets/lima/arm64
            desktop/installer/assets/lima/x64
            desktop/installer/assets/podman-static
          key: engine-assets-${{ runner.os }}-${{ hashFiles('desktop/installer/scripts/fetch-assets.sh') }}
      - uses: actions/download-artifact@v4
        if: matrix.target == '--win'
        with: { name: wsl-rootfs, path: desktop/installer/assets/wsl }
      - if: matrix.target == '--mac'
        run: scripts/fetch-assets.sh mac
      - if: matrix.target == '--linux'
        run: scripts/fetch-assets.sh linux
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/app/package-lock.json') }}
      - run: npm ci && npm --prefix ../sandbox ci && npm --prefix ../app ci
      - name: Version from the release tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: npm --prefix ../app version "${GITHUB_REF_NAME#desktop-v}" --no-git-tag-version --allow-same-version
      # Unsigned for now: signing (Windows) and notarization (macOS) need certificates as repo
      # secrets; docs/desktop-installer.md (Signing) lists what each needs.
      - run: npm run package -- ${{ matrix.target }}
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      # The packaged Mac app must start (a bad signature is a SIGKILL at launch) and its
      # bundled Lima must accept our VM template.
      - if: matrix.target == '--mac'
        run: |
          set -euo pipefail
          dmg=$(ls out/*-mac-arm64.dmg)
          vol=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3-)
          app=$(ls -d "$vol"/*.app)
          "$app/Contents/Resources/installer/lima/bin/limactl" validate "$app/Contents/Resources/installer/lima/studentide.yaml"
          "$app/Contents/MacOS/studentide" & pid=$!
          sleep 15
          kill -0 "$pid" || { echo "packaged app exited at launch"; exit 1; }
          # Wait for the app to exit before detaching, or hdiutil fails with "resource busy" (exit 16).
          kill "$pid"; wait "$pid" 2>/dev/null || true
          hdiutil detach "$vol" -quiet || hdiutil detach "$vol" -force -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: studentide-${{ runner.os }}
          path: |
            desktop/installer/out/*.exe
            desktop/installer/out/*.dmg
            desktop/installer/out/*.AppImage
            desktop/installer/out/*.deb
            desktop/installer/out/latest*.yml
            desktop/installer/out/*.blockmap
            desktop/installer/packaging/prepare-lab-pc.ps1
          if-no-files-found: error
          retention-days: 14

  # Tag builds only: one GitHub release with every installer and the update feeds
  # (latest.yml for Windows, latest-linux.yml for the AppImage).
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: studentide-*, merge-multiple: true }
      - name: Publish the release
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: |
          set -euo pipefail
          ls -la dist dist/out 2>/dev/null || true
          files=$(find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
                  -o -name 'latest*.yml' -o -name '*.blockmap' -o -name 'prepare-lab-pc.ps1' \))
          gh release create "$GITHUB_REF_NAME" $files --title "Student IDE ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Installed Windows and Linux AppImage apps update themselves the next time they close. Mac and portable builds: download the new version."
