# Builds the Sandbox Labs runtime's own images (amd64 + arm64) and pushes them to GHCR
# on main. Subject environment images are built by the catalogue's build service instead.
name: sandbox-images
on:
  push:
    branches: [main]
    paths: ["desktop/sandbox/images/**", ".github/workflows/sandbox-images.yml"]
  pull_request:
    paths: ["desktop/sandbox/images/**", ".github/workflows/sandbox-images.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  sidproxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: desktop/sandbox/images/sidproxy
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/codehamster69/studentide-sidproxy:1
  runtime-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm test
      - run: docker build -q -t studentide-dev-base:test images/dev-base && docker build -q -t ghcr.io/codehamster69/studentide-sidproxy:1 images/sidproxy
      - run: SANDBOX_IT=1 SANDBOX_IT_NET=1 npm run test:engine
