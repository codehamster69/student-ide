[project]
name = "studentide"
version = "0.1.0"
description = "Student IDE: event-logging lab editor for authorship-continuity research"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "numpy>=1.26",
  "google-auth>=2.29",  # verifies Google sign-in tokens (auth.py)
  "requests>=2.31",     # transport google-auth uses to fetch Google's keys
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
analysis = ["matplotlib>=3.8"]  # graphs written by studentide.detector.evaluate

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studentide*"]

[tool.setuptools.package-data]
studentide = ["tasks.json", "providers/data/*.jsonl.gz", "learn/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
